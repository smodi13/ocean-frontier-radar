# Theme narrative for the public Themes view.
# Prose only. Every COUNT is computed at export time from the canonical
# database/exports — nothing numeric is typed here.
# Content is condensed from research/ocean_taxonomy.md (Phase 1).

themes:
  maritime_autonomy:
    label: Maritime Autonomy & Robotics
    problem: >
      Anything done in or on the water requires a crewed vessel, a diver, or a
      tethered ROV with a support ship behind it. Support day-rates dominate the
      cost of almost every offshore activity.
    technologies:
      - Autonomous and uncrewed underwater vehicles
      - Underwater navigation without GPS; inertial and acoustic positioning
      - Launch, recovery and docking
      - Payload deployment and manipulation
    technical_bottlenecks:
      - Positioning and navigation without GPS
      - Underwater communications bandwidth
      - Energy density and endurance
      - Autonomous launch and recovery, often the real cost driver rather than the vehicle
    commercial_bottlenecks:
      - Government procurement cycles
      - Pull toward selling survey-days rather than hardware
      - Certification and class approval for uncrewed operation
    propeller_adjacency:
      - {company: Orpheus Ocean, note: "Low-cost full-ocean-depth AUVs; incubated at WHOI"}
      - {company: VATN Systems, note: "Low-cost modular mixed-mission AUVs"}
      - {company: Navier, note: "Electric hydrofoiling surface vessels"}

  ocean_sensing:
    label: Ocean Sensing, Data & Intelligence
    problem: >
      Propeller's own framing is the sharpest statement of it: almost every ocean
      market is under-resourced with information to make decisions or measure
      appropriately. Nearly half of US waters are unmapped to modern standards.
    technologies:
      - In-situ sensors and moored platforms
      - Underwater acoustic communications and hydrophone arrays
      - Environmental DNA sampling
      - Satellite-derived bathymetry and remote sensing
      - Measurement, reporting and verification for marine carbon
    technical_bottlenecks:
      - Sensor drift and calibration over long deployments
      - Biofouling of optical and electrochemical sensors, a first-order failure mode
      - Persistent power for autonomous platforms
      - Turning sparse point measurements into defensible area-wide estimates
    commercial_bottlenecks:
      - Buyers are frequently grant-funded science budgets rather than commercial P&Ls
      - Ambiguity between being an instrument vendor and a data business
      - Federal buyers often procure survey outcomes rather than hardware
    propeller_adjacency:
      - {company: Aquatic Labs, note: "Real-time ocean sensing and mCDR MRV"}
      - {company: Hum.ai, note: "Earth-observation foundation models"}
      - {company: Indeximate, note: "Subsea cable monitoring"}

  offshore_energy:
    label: Offshore Energy, Power & Subsea Infrastructure
    problem: >
      Offshore energy is bottlenecked on installation, maintenance and
      interconnection cost rather than on generation physics.
    technologies:
      - Floating offshore wind platforms and mooring
      - Subsea cables, connectors and power distribution
      - Marine and tidal energy
      - Offshore and submerged compute
    technical_bottlenecks:
      - Installation vessel scarcity and cost
      - Connector and cable reliability at depth
      - Corrosion, fatigue and biofouling on 25-year assets
      - Thermal management for submerged compute
    commercial_bottlenecks:
      - Extreme capital intensity
      - Permitting timelines measured in years
      - Utility procurement conservatism
    propeller_adjacency:
      - {company: Aikido Technologies, note: "Floating offshore wind platforms and ocean datacentres"}
      - {company: Blue Energy, note: "Coastal submerged small modular reactors"}
      - {company: Vema Hydrogen, note: "Stimulated geologic hydrogen for maritime fuel"}

  marine_carbon:
    label: Marine Carbon & Ocean Chemistry
    problem: >
      The ocean already holds roughly sixty times the carbon of the atmosphere.
      Marine carbon removal aims to enhance that sink durably and measurably. The
      gating issues are cost per tonne and verification.
    technologies:
      - Ocean alkalinity enhancement
      - Direct ocean capture and mineralisation
      - Carbon flux measurement and modelling
    technical_bottlenecks:
      - Energy intensity per tonne
      - Verification of durable removal in a moving, mixing fluid
      - Ecological impact and permitting
    commercial_bottlenecks:
      - Carbon price uncertainty and concentrated offtake
      - Registry methodology immaturity
      - Almost no observable federal procurement demand
    propeller_adjacency:
      - {company: Ebb Carbon, note: "Electrochemical ocean alkalinity enhancement"}
      - {company: Calcarea, note: "Onboard carbon capture and storage for shipping"}
      - {company: CarbonRun, note: "Riverine alkalinity enhancement"}
      - {company: pHathom, note: "Limestone capture and mineralisation"}
      - {company: Banyu Carbon, note: "Photochemical capture from seawater"}

  marine_materials:
    label: Marine Materials, Corrosion & Coastal Infrastructure
    problem: >
      Seawater destroys things. Corrosion costs the United States over half a
      trillion dollars a year, biofouling drives ship fuel consumption and sensor
      failure, and coastal infrastructure faces saltwater intrusion and rising
      wave loading.
    technologies:
      - Corrosion-resistant reinforcement and coatings
      - Biocide-free antifouling
      - Cathodic protection and corrosion monitoring
      - Coastal soil stabilisation and nature-based protection
    technical_bottlenecks:
      - Antifouling without biocides, as copper chemistry faces regulatory pressure
      - Coating adhesion and lifetime under permanent immersion
      - Multi-year field-exposure qualification cycles
    commercial_bottlenecks:
      - Commodity pricing pressure
      - Conservative specification regimes and standards bodies
      - Incumbent chemical majors
    note_hidden_adjacency: >
      This is the hidden-adjacency category. The work lives in materials science
      and civil engineering departments that never use ocean vocabulary, which is
      why the sourcing lexicon retrieves it by technical problem rather than by
      sector label.
    propeller_adjacency:
      - {company: Allium Engineering, note: "Stainless-clad rebar for coastal and marine concrete"}

  coastal_adaptation:
    label: Coastal Adaptation & Climate Risk
    problem: >
      Warming has outrun mitigation timelines and coastal industries need
      adaptation measures now, from storm-surge forecasting to shoreline
      protection.
    technologies:
      - Storm surge and inundation forecasting
      - Living shorelines and engineered reef substrate
      - Submerged barriers and soil reinforcement
    technical_bottlenecks:
      - Forecast skill at actionable resolution and lead time
      - Validating nature-based structures against engineering standards
      - Durability of deployed structures
    commercial_bottlenecks:
      - Buyers are frequently municipalities on grant cycles
      - High density of consultancy-shaped businesses rather than products
    propeller_adjacency:
      - {company: "One disclosed stealth company", note: "Propeller's portfolio page discloses a stealth company in coastal adaptation"}

  blue_food:
    label: Blue Food, Aquaculture & Marine Biology
    problem: >
      Aquaculture is the fastest-growing segment of US food production but runs
      on thin margins with severe biological risk and remarkably little digital
      instrumentation.
    technologies:
      - Disease detection and biosecurity
      - Feed and alternative inputs
      - Monitoring in turbid water
      - Seafood traceability and species identification
    technical_bottlenecks:
      - Disease detection at farm scale
      - Feed conversion and alternative feed ingredients
      - Machine vision in turbid water
    commercial_bottlenecks:
      - Producer capital constraints and low willingness to pay
      - Fragmented, often family-owned buyers
      - Long biological cycles that slow sales
    propeller_adjacency:
      - {company: Circle Seafoods, note: "Ocean-going blast-freezing barges for Alaskan salmon"}

  maritime_software:
    label: Industrial & Maritime Software / Applied AI
    problem: >
      Maritime and heavy industry run on manual processes and decades-old
      software, with connectivity at sea only recently improving.
    technologies:
      - Vessel routing and voyage optimisation
      - Port and terminal operations
      - Predictive maintenance and inspection analytics
    technical_bottlenecks:
      - Data access from legacy and air-gapped systems
      - Validating model output where errors are safety-critical
    commercial_bottlenecks:
      - Extremely conservative buyers and long pilot-to-contract cycles
      - Fragmented decision-making across owner, operator and charterer
    caution: >
      This is where the "ocean is incidental" failure mode lives. The sourcing
      lexicon requires explicit marine framing for this category, and the
      classifier flags generic AI tooling rather than admitting it.
    propeller_adjacency:
      - {company: Nexxa.ai, note: "Agentic AI for legacy heavy-industry software"}
