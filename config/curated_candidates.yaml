         claim: "Exclusive rights to Asymmetric Propulsion, US Patent No. 9,873,499."}
      - {type: patent_granted, source: whoi-armada-release, date: null,
         claim: "Exclusive rights to Rotational Feedback Control, US Patent No. 11,990,857."}
