# Manually researched candidates — Ocean Frontier Radar
#
# These come from university licensing announcements, accelerator pages and
# agency program pages. They are NOT machine-retrievable at acceptable
# reliability (see research/data_sources.md: WHOI tech transfer moved behind an
# intranet; ARPA-E returns 403 to automated requests), so they are curated by
# hand with full provenance and ingested through the same schema as everything
# else.
#
# Every claim below is quoted or paraphrased from the cited source. Nothing is
# inferred here — interpretation lives in analyst_views, not in this file.
# extraction_method for all of these is `human_read`.

